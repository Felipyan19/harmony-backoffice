name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revisa este PR enfocándote solo en bugs reales antes de que lleguen a producción:
            - errores de lógica, condiciones mal invertidas, off-by-one
            - null/undefined no manejados, race conditions
            - transacciones incompletas: creación de usuario/credenciales/perfil/roles
              debe ocurrir en una sola transacción de PostgreSQL (ver ARCHITECTURE.md)
            - fugas de aislamiento multi-tenant: queries o repositorios que no filtran
              por workspace/tenant
            - checks de autorización que deberían pasar por `requirePermission()` en el
              server boundary (DAL) y no solo confiar en el cliente o el middleware
            - casos borde no cubiertos por los tests existentes (vitest)
            No reportes preferencias de estilo ni refactors cosméticos.
            Usa `gh pr comment` para el resumen general.
            Usa `mcp__github_inline_comment__create_inline_comment` (con `confirmed: true`)
            para marcar líneas específicas.
            Solo publica vía comentarios de GitHub, no como texto de mensaje.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
